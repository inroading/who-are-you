name: Deploy upstream to Cloudflare

on:
  schedule:
    - cron: "23 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: who-cloudflare-production
  cancel-in-progress: false

env:
  SITE_URL: https://who.meitian.group
  CLOUDFLARE_ACCOUNT_ID: 7aab8873971bd5a68077ca3f7febcf93
  WRANGLER_SEND_METRICS: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      upstream_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: yt1988/who-are-you
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Test upstream and build for the custom domain
        run: |
          env -u SITE_URL npm test
          npm run build
          node scripts/build.mjs --check
      - name: Bundle the Worker
        run: npx --yes wrangler@4.161.0 deploy --dry-run --outdir bundle
      - uses: actions/upload-artifact@v4
        with:
          name: who-worker
          path: |
            bundle/worker.js
            bundle/worker.js.map
            public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: wrangler.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: deployment-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: who-worker
          path: release
      - name: Deploy only when the upstream commit changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UPSTREAM_SHA: ${{ needs.build.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN to this repository's Actions secrets."
            exit 1
          fi

          wrangler=(npx --yes wrangler@4.161.0)
          deployment=$("${wrangler[@]}" deployments status --name who --json)
          version_id=$(jq -er 'select((.versions | length) == 1) | .versions[0] | select(.percentage == 100) | .version_id' <<< "$deployment")
          version=$("${wrangler[@]}" versions view "$version_id" --name who --json)
          if jq -e --arg tag "$UPSTREAM_SHA" '.annotations["workers/tag"] == $tag' <<< "$version" >/dev/null; then
            echo "Upstream commit $UPSTREAM_SHA is already live."
            exit 0
          fi

          cp deployment-config/wrangler.toml release/wrangler.toml
          cd release
          "${wrangler[@]}" deploy bundle/worker.js --no-bundle --keep-vars --domain who.meitian.group --tag "$UPSTREAM_SHA"
