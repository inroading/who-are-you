# Cloudflare Worker: static pages from ./public (served without running the script: free, unmetered) plus src/worker.js
# for /api/me. No routes or custom domain here: on 1ms.dog the site routes the domain to this Worker. To self-host,
# bind your own domain in the dashboard (see README).
name = "who"
main = "src/worker.js"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"

# The counter behind "how common are you" (src/tally.mjs): one Durable Object, SQLite-backed, numbers only
[[durable_objects.bindings]]
name = "TALLY"
class_name = "Tally"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Tally"]
