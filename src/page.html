<!doctype html>
<html lang="{{lang}}" data-paths="{{pathsAttr}}"{{rootAttr}}>
<head>
<meta charset="utf-8">
<script>{{prepaint}}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{{head}}
<link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
{{style}}
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="{{homeHref}}" aria-current="page">
      <span class="logo"><img class="logo-light" src="/assets/logo-light.svg" width="90" height="36" alt="1ms"><img class="logo-dark" src="/assets/logo-dark.svg" width="90" height="36" alt="1ms"></span>
      <span class="brand-name" data-i="app_name"></span>
    </a>
    <div class="top-acts">
      <label class="sel"><span class="sr" data-i="lang_label"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M1.5 8h13M8 1.5c2 2 2.8 4 2.8 6.5S10 12.5 8 14.5C6 12.5 5.2 10.5 5.2 8S6 3.5 8 1.5z"/></svg>
        <select id="lang">{{langOpts}}</select>
      </label>
      <button class="icon-btn" id="helpBtn" type="button" aria-haspopup="dialog" aria-controls="help"><span class="sr" data-i="faq_h"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M6.3 6.2a1.8 1.8 0 1 1 2.5 1.7c-.5.2-.8.6-.8 1.1v.4M8 11.3v.1"/></svg>
      </button>
      <a class="icon-btn gh" href="https://github.com/yt1988/who-are-you" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .2a8 8 0 0 0-2.5 15.6c.4 0 .5-.2.5-.4v-1.5c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.3 1.9.9 2.4.7 0-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.4 7.4 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3.1-1.9 3.7-3.6 3.9.3.3.6.8.6 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 8 .2z"/></svg></a>
      <button class="icon-btn" id="theme" type="button" aria-label="{{a:a_theme}}">
        <svg class="i-sys" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5.5 14h5M8 11.5V14"/></svg>
        <svg class="i-light" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3"/></svg>
        <svg class="i-dark" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.8A5.8 5.8 0 0 1 6.2 2.5a5.8 5.8 0 1 0 7.3 7.3z"/></svg>
      </button>
    </div>
  </header>

  <main id="main"{{mainAttr}}>
    {{focus}}
    <section class="hero card">
      <div class="hero-b">
        <div class="col who">
          <p class="inapp" id="inapp"><span class="ia-t"><span class="ia-a">{{iaTxt}}</span><span class="ia-v" data-i="ia_wv"></span><span class="ia-x" data-i="ia_wx"></span></span><button type="button" id="iaCopy" data-i="ia_copy"></button></p>
          <div class="eb-row"><p class="eyebrow"><i></i>{{eyebrow}}</p><a class="live" id="live" href="{{statsHref}}"><span class="live-t"><i class="skl"></i></span><span aria-hidden="true">→</span></a></div>
          {{heroTitle}}
          <div class="m-slot" id="mSlot"></div>
          <div class="story-w"><div class="story wait fold" id="story">{{story}}</div><button class="story-more" id="storyMore" type="button" data-i="story_more"></button><div class="story-sk" id="storySk" aria-hidden="true"><i class="skl"></i><i class="skl"></i><i class="skl"></i><i class="skl"></i><i class="skl"></i><i class="skl"></i><i class="skl"></i></div></div>
          <div class="lbs" id="lbs"><span class="lbs-h" data-i="lb_h"></span><span class="lbs-l" id="lbsL"></span></div>
          <div class="vs" id="vs" hidden><h2 data-i="vs_h"></h2><p class="vs-n" id="vsN"></p><table class="vs-t" id="vsT"></table></div>
          <div class="idc" id="idc">
            <svg class="fp-art" id="fpArt" viewBox="0 0 64 64" aria-hidden="true"></svg>
            <div class="idc-t"><span class="idc-h" data-i="id_h"></span><b class="idc-v" id="fpId"><i class="skl"></i></b><span class="idc-n" id="fpNote" data-i="id_note"></span><span class="idc-r" id="fpRet">&nbsp;</span><span class="idc-u" id="fpUniq" hidden></span></div>
            <button class="icon-btn idc-x" id="forget" type="button" aria-label="{{a:rv_forget}}" title="{{a:rv_forget}}" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
          </div>
          <details class="rar-d" id="rarD" hidden><summary id="rarS"></summary><ol class="rar-l" id="rarL"></ol><p class="rar-n" data-i="rr_note"></p></details>
          <p class="tally" id="tally"><span data-i="tl_note"></span> <button type="button" id="tlMore" data-i="tl_more"></button> · <button type="button" id="tlOff"></button></p>
        </div>
        <aside class="col disg">
          <div class="sec-h"><span data-i="h_checks"></span><button class="rp-btn" id="rpCheck" type="button" hidden data-i="rp_check"></button></div>
          <div class="meter"><b class="m-num" id="mNum">–</b><div class="m-t"><div class="v-top"><p class="v-h" id="vHead" data-i="checking"></p><span class="m-grade" id="mGrade" hidden></span></div><p class="v-d" id="vText">&nbsp;</p><div class="v-acts"><button class="btn sm ink" id="share" type="button" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="12" cy="3.5" r="2"/><circle cx="4" cy="8" r="2"/><circle cx="12" cy="12.5" r="2"/><path d="M5.8 7l4.4-2.5M5.8 9l4.4 2.5"/></svg><span data-i="share"></span></button><a class="v-go" id="checkGo" target="_blank" rel="noopener" hidden></a></div></div></div>
          <div class="segs" id="segs">{{segs}}</div>
          <div class="v-meta" id="vMeta" hidden><div class="v-hist" id="vHist" hidden></div><p class="v-cmp" id="vCmp" hidden></p></div>
          <div class="scene" id="scene" role="radiogroup" aria-labelledby="sceneL"><span class="scene-l" id="sceneL" data-i="sc_h"></span><button type="button" role="radio" data-sc="all" data-i="sc_all"></button><button type="button" role="radio" data-sc="priv" data-i="sc_priv"></button></div>
          <div class="todo" id="todo"><p class="todo-h" data-i="todo_h"></p><ol id="todoL">{{todoSk}}</ol></div>
          {{checks}}
        </aside>
      </div>
      <div class="bar">
        <div class="prog" id="prog"><i></i></div>
        <span class="prog-t" id="progTxt">&nbsp;</span>
        <div class="acts">
          <button class="btn" id="mine" type="button" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="3"/><path d="M2.5 14.5c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5"/></svg><span data-i="mine"></span></button>
          <button class="btn" id="copyTxt" type="button" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg><span id="copyT" data-i="copy_txt"></span></button>
          <button class="btn" id="eye" type="button" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8s-2.4 4.5-6.5 4.5S1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg><span id="eyeT" data-i="hide"></span></button>
          <button class="btn" id="rerun" type="button" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3"/></svg><span data-i="rerun"></span></button>
        </div>
      </div>
    </section>

    <section class="target card" id="target">
      <div class="tg-h"><h2 data-i="tg_h"></h2><div class="tg-sel"><label class="sr" for="tgIn" data-i="tg_label"></label><input id="tgIn" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="tgOpts" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"><ul id="tgOpts" role="listbox" hidden></ul></div><p class="tg-sum" id="tgSum">&nbsp;</p></div>
      <ul class="tg-list" id="tgList"><li data-t="ip"><span class="tg-i"></span><span class="tg-b"><span class="tg-l"><i class="skl"></i></span><span class="tg-x"></span></span></li><li data-t="tz"><span class="tg-i"></span><span class="tg-b"><span class="tg-l"><i class="skl"></i></span><span class="tg-x"></span></span></li><li data-t="lang"><span class="tg-i"></span><span class="tg-b"><span class="tg-l"><i class="skl"></i></span><span class="tg-x"></span></span></li><li data-t="dns"><span class="tg-i"></span><span class="tg-b"><span class="tg-l"><i class="skl"></i></span><span class="tg-x"></span></span></li><li data-t="rtc"><span class="tg-i"></span><span class="tg-b"><span class="tg-l"><i class="skl"></i></span><span class="tg-x"></span></span></li></ul>
    </section>

    <section class="probes card">
      <div class="probes-h"><h2 data-i="h_src"></h2><span class="m" data-i="src_sub"></span><button class="rp-btn" id="rpRead" type="button" hidden data-i="rp_read"></button></div>
      <div class="pgroups">{{groups}}</div>
    </section>

    <nav class="topics">{{topics}}</nav>
  </main>
  <div data-ms-more></div>
</div>
<div class="scrim" id="help" hidden>
  <div class="dialog help" role="dialog" aria-modal="true" aria-labelledby="helpT">
    <div class="dlg-h"><h2 id="helpT" data-i="faq_h"></h2>
      <button class="icon-btn" data-close type="button" aria-label="{{a:a_close}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div class="help-b">
      <nav class="help-nav" id="helpNav" role="tablist">{{helpNav}}</nav>
      <div class="help-pick">
        <button class="icon-btn" type="button" data-hstep="-1" aria-label="{{a:a_prev}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 4L6 8l4 4"/></svg></button>
        <select id="helpSel" aria-labelledby="helpT"></select>
        <button class="icon-btn" type="button" data-hstep="1" aria-label="{{a:a_next}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg></button>
      </div>
      <div class="help-c" id="helpC">{{helpC}}</div>
    </div>
  </div>
</div>
<div class="adsbox ad-banner ad-placement" id="ad-slot" aria-hidden="true"></div>

{{styleLate}}
<script type="application/json" id="data">{{data}}</script>
<script defer src="/assets/{{strings}}"></script>
<script defer src="/assets/{{js}}"></script>
</body>
</html>
